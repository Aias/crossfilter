name: Demo

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm run build
      - run: pnpm --filter crossfilter-demo build
        env:
          DEMO_BASE: /crossfilter/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: demo/dist
      - id: deployment
        uses: actions/deploy-pages@v5
